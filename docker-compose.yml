version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bovweight-db
    restart: always
    environment:
      POSTGRES_USER: bovweight_user
      POSTGRES_PASSWORD: bovweight_password
      POSTGRES_DB: bovweight_db
    ports:
      - "5432:5432"
    volumes:
      - bovweight_pgdata:/var/lib/postgresql/data

  ai-api:
    build:
      context: ./ai-api
      dockerfile: Dockerfile
    container_name: bovweight-ai
    restart: always
    ports:
      - "8010:8000"   # 8000 is taken by another project on this host
    environment:
      # roll a new checkpoint out - or back - without touching the image
      - SEGMENT_MODEL=segment_v2.pt
      # cow+buffalo weight model; cattle-only fallback: predict_weight / ensemble
      - WEIGHT_DIR=predict_weight_v2
      - WEIGHT_ENSEMBLE=ensemble_cowbuff
    volumes:
      - ./ai-api/models:/app/models:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  web:
    build: 
      context: ./web
      dockerfile: Dockerfile
    container_name: bovweight-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://bovweight_user:bovweight_password@db:5432/bovweight_db?schema=public
      - AI_API_URL=http://ai-api:8000
    depends_on:
      - db
      - ai-api
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next

volumes:
  bovweight_pgdata:
